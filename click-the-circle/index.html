<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click the Circle: Fairy Lights</title>
  <style>
    html, body { margin: 0; height: 100%; color: #fdf2ff; font-family: Georgia, 'Palatino Linotype', serif; overflow: hidden; user-select: none; touch-action: manipulation;
      background: radial-gradient(ellipse at 20% 15%, #5b3a8f 0%, transparent 55%), radial-gradient(ellipse at 85% 80%, #2f6b86 0%, transparent 50%), linear-gradient(160deg, #2a1650, #1a1038 60%, #0f1f3a); }
    #stars { position: fixed; inset: 0; pointer-events: none; }
    .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.3); } }
    #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 12px 20px; font-size: 1.3rem; font-style: italic; text-shadow: 0 0 10px #d9a8ff; pointer-events: none; z-index: 2; }
    #field { position: fixed; inset: 0; }
    .circle { position: absolute; border-radius: 50%; cursor: pointer; animation: pop .25s ease-out, bob 2.2s ease-in-out .25s infinite;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #ffd6f5 25%, #d9a8ff 60%, #a5e8ff 100%);
      box-shadow: 0 0 14px 4px #ffd6f5aa, 0 0 40px 12px #c28bff77, inset 0 0 12px #ffffffaa; }
    @keyframes pop { from { transform: scale(.2) rotate(-40deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
    @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
    .spark { position: absolute; pointer-events: none; font-size: 16px; color: #fff3b0; text-shadow: 0 0 8px #ffe680; animation: fly .7s ease-out forwards; z-index: 1; }
    @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.2) rotate(180deg); opacity: 0; } }
    #overlay { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 20px; background: #1a1038d9; text-align: center; }
    #overlay h1 { margin: 0; font-size: 2.4rem; font-weight: normal; font-style: italic; text-shadow: 0 0 18px #d9a8ff; }
    #overlay p { max-width: 24rem; margin: 0; line-height: 1.5; }
    button { font: inherit; font-size: 1.2rem; padding: .6rem 1.8rem; border: 0; border-radius: 999px; color: #2a1650; cursor: pointer;
      background: linear-gradient(135deg, #ffd6f5, #c9a6ff, #a5e8ff); box-shadow: 0 0 18px #d9a8ffaa; }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div id="stars"></div>
  <div id="hud"><span>Wisps: <b id="score">0</b></span><span>Moonlight: <b id="time">30</b></span></div>
  <div id="field"></div>
  <div id="overlay">
    <h1 id="title">Fairy Lights &#10024;</h1>
    <p id="msg">Catch the glowing wisps before the moonlight fades. They grow shyer (and smaller) with every one you catch!</p>
    <button id="start">Begin</button>
  </div>
<script>
(() => {
  const field = document.getElementById('field');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const DURATION = 30;
  let score = 0, timeLeft = DURATION, timer = null, circle = null, misses = 0;

  const stars = document.getElementById('stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    Object.assign(s.style, { left: Math.random() * 100 + '%', top: Math.random() * 100 + '%', animationDelay: (Math.random() * 3) + 's' });
    stars.appendChild(s);
  }

  function best() { try { return +localStorage.getItem('ctc-best') || 0; } catch (e) { return 0; } }
  function saveBest(n) { try { localStorage.setItem('ctc-best', n); } catch (e) {} }

  function sparkle(x, y) {
    const glyphs = ['✦', '✧', '✨', '✵'];
    for (let i = 0; i < 9; i++) {
      const p = document.createElement('div');
      const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 50;
      p.className = 'spark';
      p.textContent = glyphs[i % glyphs.length];
      Object.assign(p.style, { left: x + 'px', top: y + 'px' });
      p.style.setProperty('--dx', Math.cos(a) * d + 'px');
      p.style.setProperty('--dy', Math.sin(a) * d + 'px');
      field.appendChild(p);
      setTimeout(() => p.remove(), 750);
    }
  }

  function spawn() {
    if (circle) circle.remove();
    const size = Math.max(28, 90 - score * 2);
    const x = Math.random() * (innerWidth - size);
    const y = 50 + Math.random() * (innerHeight - size - 50);
    circle = document.createElement('div');
    circle.className = 'circle';
    Object.assign(circle.style, { width: size + 'px', height: size + 'px', left: x + 'px', top: y + 'px' });
    circle.addEventListener('pointerdown', e => {
      e.stopPropagation();
      score++;
      scoreEl.textContent = score;
      sparkle(x + size / 2, y + size / 2);
      spawn();
    });
    field.appendChild(circle);
  }

  function start() {
    score = 0; misses = 0; timeLeft = DURATION;
    scoreEl.textContent = 0; timeEl.textContent = timeLeft;
    overlay.style.display = 'none';
    spawn();
    timer = setInterval(() => {
      timeEl.textContent = --timeLeft;
      if (timeLeft <= 0) end();
    }, 1000);
  }

  function end() {
    clearInterval(timer);
    if (circle) { circle.remove(); circle = null; }
    const prev = best();
    const isBest = score > prev;
    if (isBest) saveBest(score);
    document.getElementById('title').textContent = 'The moon has set ✨';
    document.getElementById('msg').textContent =
      `You caught ${score} wisp${score === 1 ? '' : 's'} (${misses} missed taps). ` +
      (isBest ? 'A new best — the fairies are impressed!' : `Best: ${prev}.`);
    document.getElementById('start').textContent = 'Play again';
    overlay.style.display = 'flex';
  }

  field.addEventListener('pointerdown', () => { if (timer && timeLeft > 0) misses++; });
  document.getElementById('start').addEventListener('click', start);
})();
</script>
</body>
</html>

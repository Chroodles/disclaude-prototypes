<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click the Circle</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161f; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; user-select: none; }
    #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 12px 18px; font-size: 1.2rem; pointer-events: none; }
    #field { position: fixed; inset: 0; }
    .circle { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9ab0, #e8335d); cursor: pointer; box-shadow: 0 0 18px #e8335d88; animation: pop .12s ease-out; }
    @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #14161fe6; text-align: center; }
    #overlay h1 { margin: 0; font-size: 2.2rem; }
    button { font: inherit; font-size: 1.2rem; padding: .6rem 1.6rem; border: 0; border-radius: 8px; background: #e8335d; color: #fff; cursor: pointer; }
    button:hover { background: #ff4d78; }
  </style>
</head>
<body>
  <div id="hud"><span>Score: <b id="score">0</b></span><span>Time: <b id="time">30</b></span></div>
  <div id="field"></div>
  <div id="overlay">
    <h1 id="title">Click the Circle</h1>
    <p id="msg">Hit as many circles as you can in 30 seconds. They shrink as you go!</p>
    <button id="start">Start</button>
  </div>
<script>
(() => {
  const field = document.getElementById('field');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const DURATION = 30;
  let score = 0, timeLeft = DURATION, timer = null, circle = null, misses = 0;

  function best() { try { return +localStorage.getItem('ctc-best') || 0; } catch (e) { return 0; } }
  function saveBest(n) { try { localStorage.setItem('ctc-best', n); } catch (e) {} }

  function spawn() {
    if (circle) circle.remove();
    const size = Math.max(28, 90 - score * 2);
    const x = Math.random() * (innerWidth - size);
    const y = 50 + Math.random() * (innerHeight - size - 50);
    circle = document.createElement('div');
    circle.className = 'circle';
    Object.assign(circle.style, { width: size + 'px', height: size + 'px', left: x + 'px', top: y + 'px' });
    circle.addEventListener('pointerdown', e => {
      e.stopPropagation();
      score++;
      scoreEl.textContent = score;
      spawn();
    });
    field.appendChild(circle);
  }

  function start() {
    score = 0; misses = 0; timeLeft = DURATION;
    scoreEl.textContent = 0; timeEl.textContent = timeLeft;
    overlay.style.display = 'none';
    spawn();
    timer = setInterval(() => {
      timeEl.textContent = --timeLeft;
      if (timeLeft <= 0) end();
    }, 1000);
  }

  function end() {
    clearInterval(timer);
    if (circle) { circle.remove(); circle = null; }
    const prev = best();
    const isBest = score > prev;
    if (isBest) saveBest(score);
    document.getElementById('title').textContent = 'Time!';
    document.getElementById('msg').textContent =
      `You hit ${score} circle${score === 1 ? '' : 's'} (${misses} missed clicks). ` +
      (isBest ? 'New best!' : `Best: ${prev}.`);
    document.getElementById('start').textContent = 'Play again';
    overlay.style.display = 'flex';
  }

  field.addEventListener('pointerdown', () => { if (timer && timeLeft > 0) misses++; });
  document.getElementById('start').addEventListener('click', start);
})();
</script>
</body>
</html>
